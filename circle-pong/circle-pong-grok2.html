<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Circle Pong</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%237ad7ff' stroke-width='3'/%3E%3Cpath d='M18 46a20 20 0 0 1 28-28' fill='none' stroke='%23ff6b3d' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='40' cy='24' r='4' fill='%23f4f8ff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07080c;
      --ink: #eef6ff;
      --muted: #8b97ab;
      --line: rgba(255, 255, 255, 0.1);
      --accent: #7ad7ff;
      --hot: #ff6b3d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: none;
    }
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      padding: 22px 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      opacity: 0;
      transition: opacity 220ms ease;
    }
    #hud.visible { opacity: 1; }
    .hud-block .label {
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--muted);
      font-weight: 500;
    }
    .hud-block .value {
      font-family: Syne, sans-serif;
      font-size: 34px;
      line-height: 1.05;
      font-weight: 800;
      margin-top: 2px;
    }
    #hud-right { text-align: right; }
    #lives {
      display: flex;
      gap: 7px;
      justify-content: flex-end;
      margin-top: 10px;
    }
    #lives span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--hot);
      box-shadow: 0 0 10px rgba(255, 107, 61, 0.7);
    }
    #lives span.empty {
      background: transparent;
      border: 1px solid rgba(255, 107, 61, 0.4);
      box-shadow: none;
    }
    #sound-btn {
      pointer-events: auto;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      color: var(--muted);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      z-index: 5;
    }
    #sound-btn:hover { color: var(--ink); border-color: rgba(255,255,255,0.25); }
    #overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 4;
      background: radial-gradient(ellipse at center, rgba(7, 8, 12, 0.18) 0%, rgba(7, 8, 12, 0.62) 100%);
      opacity: 1;
      transition: opacity 220ms ease;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #panel {
      text-align: center;
      max-width: 420px;
      padding: 28px 24px;
    }
    #panel h1 {
      font-family: Syne, sans-serif;
      font-size: clamp(42px, 8vw, 72px);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.9;
    }
    #panel .tag {
      margin-top: 14px;
      color: var(--muted);
      font-size: 16px;
    }
    #panel .help {
      list-style: none;
      margin: 28px 0 8px;
      color: #c9d4e3;
      font-size: 14px;
      line-height: 1.9;
    }
    kbd {
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.05);
      padding: 1px 7px;
      border-radius: 6px;
      color: var(--accent);
    }
    #play {
      margin-top: 22px;
      pointer-events: auto;
      cursor: pointer;
      border: 0;
      background: var(--ink);
      color: #0b0d12;
      font-family: Syne, sans-serif;
      font-weight: 800;
      letter-spacing: 0.12em;
      font-size: 14px;
      padding: 14px 34px;
      border-radius: 999px;
    }
    #play:hover { transform: translateY(-1px); }
    #panel .hint {
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
    }
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.55) 100%);
      z-index: 2;
    }
    #ctrl-dock {
      pointer-events: auto;
      position: fixed;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      max-width: calc(100vw - 20px);
      touch-action: auto;
    }
    .panel {
      background: rgba(30, 41, 59, 0.8);
      padding: 2rem;
      border-radius: 1rem;
      backdrop-filter: blur(8px);
      pointer-events: auto;
      text-align: center;
      min-width: 300px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .controls {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      text-align: left;
      gap: 0.25rem;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.875rem;
      opacity: 0.8;
    }
    #ctrl-dock input[type="range"] {
      width: 100%;
      cursor: pointer;
      accent-color: #22d3ee;
    }
    #pause-btn {
      pointer-events: auto;
      cursor: pointer;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
      font-family: Syne, sans-serif;
      font-weight: 800;
      letter-spacing: 0.12em;
      font-size: 12px;
      padding: 10px 16px;
      border-radius: 999px;
      min-width: 7.6em;
    }
    #pause-btn:hover { border-color: rgba(255,255,255,0.28); }
    #pause-btn[aria-pressed="true"] {
      background: var(--ink);
      color: #0b0d12;
      border-color: var(--ink);
    }
    #paused-flag {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      pointer-events: none;
      font-family: Syne, sans-serif;
      font-weight: 800;
      letter-spacing: 0.18em;
      font-size: 13px;
      color: var(--accent);
      opacity: 0;
      transition: opacity 180ms ease;
    }
    body.is-paused #paused-flag { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <button id="sound-btn" aria-label="Toggle sound" title="Toggle sound">
    <svg id="icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M4 10v4h3l5 4V6L7 10H4z" />
      <path d="M16.5 8.5a5 5 0 0 1 0 7" />
      <path d="M19 6a8.5 8.5 0 0 1 0 12" />
    </svg>
    <svg id="icon-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" hidden>
      <path d="M4 10v4h3l5 4V6L7 10H4z" />
      <path d="M19 7l-6 10" />
    </svg>
  </button>
  <div id="paused-flag">PAUSED</div>
  <div id="ctrl-dock" class="panel">
    <button id="pause-btn" type="button" hidden aria-pressed="false">PAUSE</button>
    <div class="controls">
      <div class="slider-group">
        <div class="slider-header">
          <label for="speed">Ball Speed</label>
          <span id="speed-val" class="ctrl-val">1.0×</span>
        </div>
        <input id="speed" type="range" min="0.5" max="3" step="0.1" value="1" />
      </div>
      <div class="slider-group">
        <div class="slider-header">
          <label for="paddle-size">Paddle Size</label>
          <span id="paddle-size-val" class="ctrl-val">1.0×</span>
        </div>
        <input id="paddle-size" type="range" min="0.5" max="2" step="0.1" value="1" />
      </div>
      <div class="slider-group">
        <div class="slider-header">
          <label for="circle-size">Circle Size</label>
          <span id="circle-size-val" class="ctrl-val">1.0×</span>
        </div>
        <input id="circle-size" type="range" min="0.6" max="1.4" step="0.05" value="1" />
      </div>
    </div>
  </div>
  <div id="hud">
    <div class="hud-block">
      <div class="label">SCORE</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="hud-block" id="hud-right">
      <div class="label">BEST</div>
      <div class="value" id="best">0</div>
      <div id="lives"></div>
    </div>
  </div>
  <div id="overlay">
    <div id="panel"></div>
  </div>
  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const overlay = document.getElementById("overlay");
      const panel = document.getElementById("panel");
      const hud = document.getElementById("hud");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const livesEl = document.getElementById("lives");
      const soundBtn = document.getElementById("sound-btn");
      const iconOn = document.getElementById("icon-on");
      const iconOff = document.getElementById("icon-off");
      const speedInput = document.getElementById("speed");
      const speedVal = document.getElementById("speed-val");
      const paddleSizeInput = document.getElementById("paddle-size");
      const paddleSizeVal = document.getElementById("paddle-size-val");
      const circleSizeInput = document.getElementById("circle-size");
      const circleSizeVal = document.getElementById("circle-size-val");
      const ctrlDock = document.getElementById("ctrl-dock");
      const pauseBtn = document.getElementById("pause-btn");

      const HS_KEY = "circlepong-best";
      const SPEED_KEY = "circlepong-speed";
      const PADDLE_KEY = "circlepong-paddle";
      const CIRCLE_KEY = "circlepong-circle";
      const TAU = Math.PI * 2;
      const PADDLE_HALF0 = 0.31;

      const state = {
        mode: "menu", // menu | playing | paused | gameover
        w: 0,
        h: 0,
        cx: 0,
        cy: 0,
        R: 220,
        dpr: 1,
        paddleAngle: Math.PI / 2,
        paddleOmega: 0,
        paddleHalf: 0.31,
        lives: 3,
        score: 0,
        best: Number(localStorage.getItem(HS_KEY) || 0),
        combo: 0,
        hits: 0,
        speedMul: 1,
        baseSpeed: 1,
        paddleSizeMul: 1,
        circleSizeMul: 1,
        ball: { x: 0, y: 0, vx: 0, vy: 0, r: 8 },
        escaping: false,
        resetAt: 0,
        shake: 0,
        flash: 0,
        trail: [],
        particles: [],
        floaters: [],
        rimMarks: [],
        keys: { left: false, right: false },
        pointerActive: false,
        lastPointer: 0,
        sound: true,
        audio: null,
        comboPulse: 0,
        time: 0,
        servingUntil: 0,
      };

      window.__circlePongDebug = () => {
        const pred = predictedImpact();
        return {
          mode: state.mode,
          score: state.score,
          lives: state.lives,
          combo: state.combo,
          hits: state.hits,
          paddleAngle: state.paddleAngle,
          paddleHalf: state.paddleHalf,
          paddleSizeMul: state.paddleSizeMul,
          circleSizeMul: state.circleSizeMul,
          ball: { ...state.ball },
          escaping: state.escaping,
          predAng: pred ? pred.ang : null,
          predT: pred ? pred.t : null,
          R: state.R,
          cx: state.cx,
          cy: state.cy,
        };
      };

      bestEl.textContent = String(state.best);

      function normAngle(a) {
        a = (a + Math.PI) % TAU;
        if (a < 0) a += TAU;
        return a - Math.PI;
      }

      function angleDiff(a, b) {
        return normAngle(a - b);
      }

      function lerpAngle(a, b, t) {
        return a + angleDiff(b, a) * t;
      }

      function rand(a, b) {
        return a + Math.random() * (b - a);
      }

      function ensureAudio() {
        if (state.audio) return state.audio;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        state.audio = new AC();
        return state.audio;
      }

      function tone(freq, dur, type, vol, slide) {
        if (!state.sound) return;
        const ac = ensureAudio();
        if (!ac) return;
        if (ac.state === "suspended") ac.resume();
        const t0 = ac.currentTime;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, t0);
        if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
        gain.gain.setValueAtTime(vol, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
      }

      function layout() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        state.w = w;
        state.h = h;
        state.dpr = dpr;
        syncArena();
      }

      function syncArena() {
        const w = state.w;
        const h = state.h;
        const dockH = (ctrlDock.offsetHeight || 80) + 22;
        const oldR = state.R;
        state.cx = w / 2;
        state.cy = (h - dockH) * 0.5 + 8;
        const fit = Math.min(w, Math.max(160, h - dockH)) * 0.36 * state.circleSizeMul;
        const maxFit = Math.min(state.cx, state.cy - 52, w - state.cx, h - dockH - state.cy) - 16;
        state.R = Math.max(64, Math.min(fit, maxFit));
        state.ball.r = Math.max(7, state.R * 0.022);
        if (oldR > 1) {
          const s = state.R / oldR;
          state.ball.x *= s;
          state.ball.y *= s;
          state.ball.vx *= s;
          state.ball.vy *= s;
        }
      }

      function paddleThickness() {
        return Math.max(12, state.R * 0.038);
      }

      function collideR() {
        return state.R - paddleThickness() * 0.35;
      }

      function currentHalf() {
        const base = PADDLE_HALF0 * state.paddleSizeMul;
        return Math.min(Math.PI * 0.72, Math.max(base * 0.5, base - state.hits * 0.00275));
      }

      function snapMul(v, min, max, step) {
        const n = Number(v);
        const x = Number.isFinite(n) ? n : 1;
        const snapped = Math.round(x / step) * step;
        return Math.round(Math.max(min, Math.min(max, snapped)) * 100) / 100;
      }

      function setMulLabel(el, v) {
        const decimals = Math.round(v * 10) === v * 10 ? 1 : 2;
        el.textContent = v.toFixed(decimals) + "×";
      }

      function speedFactor() {
        return state.speedMul * state.baseSpeed;
      }

      function applyBaseSpeed(v, scaleBall) {
        const next = snapMul(v, 0.5, 3, 0.1);
        const prev = state.baseSpeed || 1;
        if (scaleBall && prev > 0 && next !== prev) {
          const s = next / prev;
          state.ball.vx *= s;
          state.ball.vy *= s;
        }
        state.baseSpeed = next;
        speedInput.value = String(next);
        setMulLabel(speedVal, next);
        localStorage.setItem(SPEED_KEY, String(next));
      }

      function applyPaddleSize(v) {
        const next = snapMul(v, 0.5, 2, 0.1);
        state.paddleSizeMul = next;
        state.paddleHalf = currentHalf();
        paddleSizeInput.value = String(next);
        setMulLabel(paddleSizeVal, next);
        localStorage.setItem(PADDLE_KEY, String(next));
      }

      function applyCircleSize(v) {
        const next = snapMul(v, 0.6, 1.4, 0.05);
        state.circleSizeMul = next;
        circleSizeInput.value = String(next);
        setMulLabel(circleSizeVal, next);
        localStorage.setItem(CIRCLE_KEY, String(next));
        if (state.w > 0) syncArena();
      }

      function serve(randomize = true, delay = 0.65) {
        const R = state.R;
        const speed = R * 0.44 * speedFactor();
        const ang = randomize ? rand(0, TAU) : Math.atan2(state.ball.vy, state.ball.vx) || rand(0, TAU);
        state.ball.x = 0;
        state.ball.y = 0;
        state.ball.vx = Math.cos(ang) * speed;
        state.ball.vy = Math.sin(ang) * speed;
        state.escaping = false;
        state.trail = [];
        state.servingUntil = state.time + delay;
      }

      function resetMatch() {
        state.lives = 3;
        state.score = 0;
        state.combo = 0;
        state.hits = 0;
        state.speedMul = 1;
        state.paddleHalf = currentHalf();
        state.paddleAngle = Math.PI / 2;
        state.paddleOmega = 0;
        state.particles = [];
        state.floaters = [];
        state.rimMarks = [];
        state.shake = 0;
        state.flash = 0;
        serve(true, 0.7);
        updateHud();
      }

      function updateHud() {
        scoreEl.textContent = String(state.score);
        bestEl.textContent = String(state.best);
        livesEl.innerHTML = "";
        for (let i = 0; i < 3; i++) {
          const d = document.createElement("span");
          if (i >= state.lives) d.className = "empty";
          livesEl.appendChild(d);
        }
      }

      function saveBest() {
        if (state.score > state.best) {
          state.best = state.score;
          localStorage.setItem(HS_KEY, String(state.best));
        }
        bestEl.textContent = String(state.best);
      }

      function burst(x, y, color, n, speed) {
        for (let i = 0; i < n; i++) {
          const a = rand(0, TAU);
          const s = rand(speed * 0.25, speed);
          state.particles.push({
            x, y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            life: rand(0.35, 0.85),
            max: 0.85,
            r: rand(1.2, 3.2),
            color,
          });
        }
      }

      function predictedImpact() {
        const { x, y, vx, vy } = state.ball;
        const r = collideR();
        const a = vx * vx + vy * vy;
        if (a < 1e-6) return null;
        const b = 2 * (x * vx + y * vy);
        const c = x * x + y * y - r * r;
        const disc = b * b - 4 * a * c;
        if (disc < 0) return null;
        const sqrtD = Math.sqrt(disc);
        const t1 = (-b - sqrtD) / (2 * a);
        const t2 = (-b + sqrtD) / (2 * a);
        const t = t1 > 0.01 ? t1 : (t2 > 0.01 ? t2 : null);
        if (t == null) return null;
        const ix = x + vx * t;
        const iy = y + vy * t;
        return { t, x: ix, y: iy, ang: Math.atan2(iy, ix) };
      }

      function onPaddle(ang) {
        const extra = paddleThickness() * 0.5 / Math.max(state.R, 1) + 0.05;
        return Math.abs(angleDiff(ang, state.paddleAngle)) <= state.paddleHalf + extra;
      }

      function bounce(ang) {
        const nx = Math.cos(ang);
        const ny = Math.sin(ang);
        const tx = -ny;
        const ty = nx;
        const b = state.ball;
        let vr = b.vx * nx + b.vy * ny;
        let vt = b.vx * tx + b.vy * ty;
        const offset = angleDiff(ang, state.paddleAngle) / Math.max(state.paddleHalf, 0.15);
        const paddleVt = state.paddleOmega * collideR();
        vt = vt * 0.88 + paddleVt * 0.62 + offset * Math.hypot(b.vx, b.vy) * 0.22;
        const boost = 1.03 + Math.min(state.combo, 16) * 0.003;
        const minOut = state.R * 0.28 * speedFactor();
        vr = -Math.max(Math.abs(vr) * boost, minOut);
        b.vx = vr * nx + vt * tx;
        b.vy = vr * ny + vt * ty;
        const cap = state.R * 1.25 * state.baseSpeed;
        const spd = Math.hypot(b.vx, b.vy);
        if (spd > cap) {
          b.vx *= cap / spd;
          b.vy *= cap / spd;
        }
        const inside = collideR() - b.r - 1.25;
        b.x = nx * inside;
        b.y = ny * inside;
      }

      function registerHit(ang) {
        if (state.mode !== "playing") {
          bounce(ang);
          tone(420, 0.06, "sine", 0.03);
          return;
        }
        state.combo += 1;
        state.hits += 1;
        state.speedMul = Math.min(2.15, 1 + state.hits * 0.028);
        state.paddleHalf = currentHalf();
        const pts = state.combo;
        state.score += pts;
        state.comboPulse = 1;
        const hitX = Math.cos(ang) * state.R;
        const hitY = Math.sin(ang) * state.R;
        burst(hitX, hitY, "#ffd7b0", 14, state.R * 0.7);
        state.rimMarks.push({ ang, life: 0.45, ok: true });
        state.floaters.push({
          x: hitX * 0.82,
          y: hitY * 0.82,
          text: "+" + pts,
          life: 0.8,
        });
        state.shake = Math.min(5, 1.2 + state.combo * 0.12);
        bounce(ang);
        updateHud();
        saveBest();
        const f = 380 + Math.min(state.combo, 12) * 42;
        tone(f, 0.07, "triangle", 0.045);
        tone(f * 2, 0.05, "sine", 0.02);
      }

      function registerMiss(ang) {
        if (state.mode !== "playing" || state.escaping) return;
        state.escaping = true;
        state.combo = 0;
        state.lives -= 1;
        state.flash = 0.55;
        state.shake = 10;
        state.rimMarks.push({ ang, life: 0.7, ok: false });
        burst(Math.cos(ang) * state.R, Math.sin(ang) * state.R, "#ff4d6a", 22, state.R * 1.1);
        updateHud();
        tone(240, 0.28, "sawtooth", 0.04, 70);
        if (state.lives <= 0) {
          state.resetAt = state.time + 0.85;
        } else {
          state.resetAt = state.time + 0.7;
        }
      }

      function setPointerAngle(clientX, clientY) {
        const dx = clientX - state.cx;
        const dy = clientY - state.cy;
        if (dx * dx + dy * dy < 36 * 36) return;
        state.pointerActive = true;
        state.lastPointer = state.time;
        const next = Math.atan2(dy, dx);
        const dt = Math.max(1 / 120, Math.min(0.05, state._dt || 0.016));
        state.paddleOmega = angleDiff(next, state.paddleAngle) / dt;
        state.paddleAngle = next;
      }

      function stepPaddle(dt) {
        const usingKeys = state.keys.left || state.keys.right;
        if (usingKeys) {
          const dir = (state.keys.right ? 1 : 0) - (state.keys.left ? 1 : 0);
          const omega = dir * 3.35;
          state.paddleOmega = omega;
          state.paddleAngle += omega * dt;
          state.pointerActive = false;
        } else if (state.mode === "menu") {
          const pred = predictedImpact();
          const target = pred ? pred.ang : state.paddleAngle;
          const prev = state.paddleAngle;
          state.paddleAngle = lerpAngle(state.paddleAngle, target, 1 - Math.pow(0.0002, dt));
          state.paddleOmega = angleDiff(state.paddleAngle, prev) / dt;
        } else {
          state.paddleOmega *= Math.pow(0.12, dt);
        }
        state.paddleAngle = normAngle(state.paddleAngle);
      }

      function stepBall(dt) {
        if (state.time < state.servingUntil) {
          state.ball.x = 0;
          state.ball.y = 0;
          state.trail = [];
          return;
        }
        const b = state.ball;
        const steps = Math.max(1, Math.ceil((Math.hypot(b.vx, b.vy) * dt) / 5));
        const h = dt / steps;
        for (let i = 0; i < steps; i++) {
          b.x += b.vx * h;
          b.y += b.vy * h;
          const dist = Math.hypot(b.x, b.y);
          const limit = collideR() - b.r;
          if (dist >= limit) {
            const ang = Math.atan2(b.y, b.x);
            const vr = (b.vx * b.x + b.vy * b.y) / Math.max(dist, 1e-6);
            if (state.mode === "menu" || (state.mode === "paused")) {
              bounce(ang);
            } else if (!state.escaping && vr > 0) {
              if (onPaddle(ang)) registerHit(ang);
              else registerMiss(ang);
            }
          }
        }
        state.trail.push({ x: b.x, y: b.y });
        if (state.trail.length > 18) state.trail.shift();
      }

      function stepFx(dt) {
        state.shake = Math.max(0, state.shake - dt * 18);
        state.flash = Math.max(0, state.flash - dt * 1.6);
        state.comboPulse = Math.max(0, state.comboPulse - dt * 2.4);
        for (const p of state.particles) {
          p.life -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.98;
          p.vy *= 0.98;
        }
        state.particles = state.particles.filter((p) => p.life > 0);
        for (const f of state.floaters) {
          f.life -= dt;
          f.y -= 28 * dt;
        }
        state.floaters = state.floaters.filter((f) => f.life > 0);
        for (const m of state.rimMarks) m.life -= dt;
        state.rimMarks = state.rimMarks.filter((m) => m.life > 0);
      }

      function maybeReset() {
        if (!state.escaping || state.time < state.resetAt) return;
        if (state.lives <= 0) {
          saveBest();
          setMode("gameover");
          tone(140, 0.45, "triangle", 0.05, 50);
          return;
        }
        serve(true, 0.55);
      }

      function drawArena(cx, cy) {
        const R = state.R;
        ctx.save();
        const g = ctx.createRadialGradient(cx, cy, R * 0.1, cx, cy, R * 1.15);
        g.addColorStop(0, "rgba(40, 70, 110, 0.16)");
        g.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, R * 1.15, 0, TAU);
        ctx.fill();

        ctx.strokeStyle = "rgba(122, 215, 255, 0.07)";
        ctx.lineWidth = 1;
        for (let i = 1; i <= 3; i++) {
          ctx.beginPath();
          ctx.arc(cx, cy, R * (i / 3) * 0.92, 0, TAU);
          ctx.stroke();
        }

        ctx.strokeStyle = "rgba(180, 220, 255, 0.18)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, TAU);
        ctx.stroke();

        ctx.shadowColor = "rgba(122, 215, 255, 0.35)";
        ctx.shadowBlur = 18;
        ctx.strokeStyle = "rgba(180, 230, 255, 0.55)";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, TAU);
        ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.strokeStyle = "rgba(255,255,255,0.16)";
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 60; i++) {
          const a = (i / 60) * TAU;
          const major = i % 5 === 0;
          const inner = R + (major ? 6 : 3);
          const outer = R + (major ? 14 : 8);
          ctx.globalAlpha = major ? 0.35 : 0.16;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
          ctx.lineTo(cx + Math.cos(a) * outer, cy + Math.sin(a) * outer);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        ctx.fillStyle = "rgba(234, 244, 255, 0.55)";
        ctx.beginPath();
        ctx.arc(cx, cy, 3.2, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function drawPaddle(cx, cy) {
        const R = state.R;
        const thick = paddleThickness();
        const a0 = state.paddleAngle - state.paddleHalf;
        const a1 = state.paddleAngle + state.paddleHalf;
        ctx.save();
        ctx.lineCap = "round";

        ctx.shadowColor = "rgba(255, 107, 61, 0.85)";
        ctx.shadowBlur = 28;
        ctx.strokeStyle = "rgba(255, 107, 61, 0.35)";
        ctx.lineWidth = thick + 14;
        ctx.beginPath();
        ctx.arc(cx, cy, R, a0, a1);
        ctx.stroke();

        ctx.shadowBlur = 16;
        ctx.strokeStyle = "#ff6b3d";
        ctx.lineWidth = thick;
        ctx.beginPath();
        ctx.arc(cx, cy, R, a0, a1);
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#ffe1c4";
        ctx.lineWidth = Math.max(3, thick * 0.28);
        ctx.beginPath();
        ctx.arc(cx, cy, R, a0, a1);
        ctx.stroke();
        ctx.restore();
      }

      function drawBall(cx, cy) {
        const b = state.ball;
        ctx.save();
        for (let i = 0; i < state.trail.length; i++) {
          const t = state.trail[i];
          const k = (i + 1) / state.trail.length;
          ctx.globalAlpha = k * 0.35;
          ctx.fillStyle = "#9fd9ff";
          ctx.beginPath();
          ctx.arc(cx + t.x, cy + t.y, b.r * (0.35 + k * 0.5), 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        const x = cx + b.x;
        const y = cy + b.y;
        ctx.shadowColor = "rgba(180, 230, 255, 0.9)";
        ctx.shadowBlur = 22;
        ctx.fillStyle = "#f4f8ff";
        ctx.beginPath();
        ctx.arc(x, y, b.r, 0, TAU);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.beginPath();
        ctx.arc(x - b.r * 0.28, y - b.r * 0.28, b.r * 0.28, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function drawFx(cx, cy) {
        ctx.save();
        for (const m of state.rimMarks) {
          ctx.globalAlpha = Math.max(0, m.life * 1.4);
          ctx.strokeStyle = m.ok ? "#ffe1c4" : "#ff5a73";
          ctx.lineWidth = m.ok ? 6 : 10;
          ctx.lineCap = "round";
          const span = 0.08;
          ctx.beginPath();
          ctx.arc(cx, cy, state.R, m.ang - span, m.ang + span);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        for (const p of state.particles) {
          ctx.globalAlpha = Math.max(0, p.life / p.max);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(cx + p.x, cy + p.y, p.r, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.font = "700 16px 'IBM Plex Sans', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (const f of state.floaters) {
          ctx.globalAlpha = Math.max(0, f.life * 1.3);
          ctx.fillStyle = "#fff4e8";
          ctx.fillText(f.text, cx + f.x, cy + f.y);
        }
        ctx.restore();

        if (state.combo >= 2 && state.mode === "playing") {
          ctx.save();
          ctx.globalAlpha = 0.35 + state.comboPulse * 0.5;
          ctx.fillStyle = "#eef6ff";
          ctx.font = "800 42px Syne, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("x" + state.combo, cx, cy);
          ctx.restore();
        }
      }

      function render() {
        const { w, h } = state;
        ctx.clearRect(0, 0, w, h);
        const bg = ctx.createRadialGradient(w * 0.5, h * 0.45, 20, w * 0.5, h * 0.5, Math.max(w, h) * 0.7);
        bg.addColorStop(0, "#12151f");
        bg.addColorStop(1, "#07080c");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);

        const sx = (Math.random() - 0.5) * state.shake;
        const sy = (Math.random() - 0.5) * state.shake;
        const cx = state.cx + sx;
        const cy = state.cy + sy;

        drawArena(cx, cy);
        drawPaddle(cx, cy);
        drawBall(cx, cy);
        drawFx(cx, cy);

        if (state.flash > 0) {
          ctx.fillStyle = `rgba(255, 50, 80, ${state.flash * 0.18})`;
          ctx.fillRect(0, 0, w, h);
        }
      }

      function syncPauseBtn() {
        const canPause = state.mode === "playing" || state.mode === "paused";
        pauseBtn.hidden = !canPause;
        const paused = state.mode === "paused";
        pauseBtn.textContent = paused ? "CONTINUE" : "PAUSE";
        pauseBtn.setAttribute("aria-pressed", paused ? "true" : "false");
        document.body.classList.toggle("is-paused", paused);
      }

      function togglePause() {
        if (state.mode === "playing") setMode("paused");
        else if (state.mode === "paused") setMode("playing");
      }

      function setMode(mode) {
        state.mode = mode;
        if (mode === "menu") {
          hud.classList.remove("visible");
          overlay.classList.remove("hidden");
          panel.innerHTML = `
            <h1>CIRCLE<br>PONG</h1>
            <p class="tag">Sweep a curved paddle around the rim and keep the ball inside.</p>
            <ul class="help">
              <li><kbd>Mouse</kbd> / <kbd>Touch</kbd> — drag around the circle</li>
              <li><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> — rotate</li>
              <li><kbd>Space</kbd> or Pause — freeze to tweak sliders</li>
              <li><kbd>M</kbd> — mute</li>
              <li>Sliders — speed, paddle size, circle size (persist)</li>
            </ul>
            <button id="play">PLAY</button>
            <p class="hint">Hits score. Edges add spin. Don’t leave a gap.</p>
          `;
          document.getElementById("play").addEventListener("click", startGame);
        } else if (mode === "paused") {
          hud.classList.add("visible");
          overlay.classList.add("hidden");
        } else if (mode === "gameover") {
          hud.classList.add("visible");
          overlay.classList.remove("hidden");
          panel.innerHTML = `
            <h1>OUT</h1>
            <p class="tag">Score ${state.score} · Best ${state.best}</p>
            <button id="play">AGAIN</button>
            <p class="hint">Space also works.</p>
          `;
          document.getElementById("play").addEventListener("click", startGame);
        } else {
          overlay.classList.add("hidden");
          hud.classList.add("visible");
        }
        syncPauseBtn();
      }

      function startGame() {
        ensureAudio();
        resetMatch();
        setMode("playing");
        tone(520, 0.08, "sine", 0.04);
      }

      function toggleSound() {
        state.sound = !state.sound;
        iconOn.hidden = !state.sound;
        iconOff.hidden = state.sound;
        if (state.sound) {
          ensureAudio();
          tone(640, 0.06, "sine", 0.03);
        }
      }

      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.033, (now - last) / 1000);
        last = now;
        state._dt = dt;
        state.time += dt;

        if (state.mode !== "paused") {
          stepPaddle(dt);
          stepBall(dt);
          stepFx(dt);
          maybeReset();
        } else {
          stepFx(dt);
        }
        render();
        requestAnimationFrame(frame);
      }

      window.addEventListener("resize", layout);

      window.addEventListener("pointermove", (e) => {
        if (e.target.closest("#ctrl-dock")) return;
        if (state.mode === "playing") {
          setPointerAngle(e.clientX, e.clientY);
        }
      });

      window.addEventListener("pointerdown", (e) => {
        if (e.target.closest("button") || e.target.closest("#ctrl-dock")) return;
        if (state.mode === "menu" || state.mode === "gameover") {
          startGame();
          setPointerAngle(e.clientX, e.clientY);
          return;
        }
        if (state.mode === "playing") setPointerAngle(e.clientX, e.clientY);
      });

      window.addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (e.target.closest("#ctrl-dock") && (k === "arrowleft" || k === "arrowright")) return;
        if (k === "arrowleft" || k === "a") state.keys.left = true;
        if (k === "arrowright" || k === "d") state.keys.right = true;
        if (k === "m") toggleSound();
        if (k === " " || k === "enter") {
          e.preventDefault();
          if (state.mode === "menu" || state.mode === "gameover") startGame();
          else if (state.mode === "playing") setMode("paused");
          else if (state.mode === "paused") setMode("playing");
        }
        if (k === "escape") togglePause();
      });

      window.addEventListener("keyup", (e) => {
        const k = e.key.toLowerCase();
        if (k === "arrowleft" || k === "a") state.keys.left = false;
        if (k === "arrowright" || k === "d") state.keys.right = false;
      });

      soundBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleSound();
      });

      ctrlDock.addEventListener("pointerdown", (e) => e.stopPropagation());
      pauseBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        togglePause();
      });
      speedInput.addEventListener("input", (e) => applyBaseSpeed(e.target.value, true));
      paddleSizeInput.addEventListener("input", (e) => applyPaddleSize(e.target.value));
      circleSizeInput.addEventListener("input", (e) => applyCircleSize(e.target.value));
      applyBaseSpeed(localStorage.getItem(SPEED_KEY) || 1, false);
      applyPaddleSize(localStorage.getItem(PADDLE_KEY) || 1);
      applyCircleSize(localStorage.getItem(CIRCLE_KEY) || 1);

      layout();
      serve(true, 0.05);
      updateHud();
      setMode("menu");
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
