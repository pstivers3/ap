<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Circular Pong</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f1117;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #e6e6e6;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.5px;
    color: #9fd3ff;
  }
  canvas {
    background: #14161f;
    border-radius: 50%;
    box-shadow: 0 0 40px rgba(80,160,255,0.15);
    touch-action: none;
    cursor: none;
  }
  #hud {
    display: flex;
    gap: 24px;
    font-size: 14px;
    color: #aab2c5;
  }
  #hud span { color: #fff; font-weight: 600; }
  #controls {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: center;
    background: #1a1d29;
    padding: 12px 20px;
    border-radius: 10px;
  }
  .control {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 14px;
    color: #aab2c5;
  }
  .control output { color: #9fd3ff; font-weight: 600; }
  .keyhint { font-size: 13px; color: #6b7280; }
  .keyhint kbd {
    display: inline-block;
    background: #2a2e3d;
    color: #9fd3ff;
    padding: 1px 6px;
    border-radius: 4px;
    font-family: inherit;
    font-weight: 600;
  }
  input[type=range] { width: 160px; accent-color: #5aa9ff; }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,12,18,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
  }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: 28px; }
  button {
    background: #5aa9ff;
    border: none;
    color: #0f1117;
    font-weight: 700;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #7dbcff; }
  #hint { font-size: 14px; color: #6b7280; text-align: center; max-width: 420px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>CIRCULAR PONG</h1>
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>
  <canvas id="game" width="480" height="480"></canvas>
  <div id="controls">
    <div class="control">
      Ball Speed: <output id="speedVal">1.7</output>
      <div class="keyhint"><kbd>Z</kbd> slower · <kbd>X</kbd> faster</div>
    </div>
    <div class="control">
      Paddle Size: <output id="paddleVal">40°</output>
      <input id="paddle" type="range" min="10" max="150" step="5" value="40">
    </div>
  </div>
  <div id="hint">Move your mouse (or finger) around the circle to steer the paddle. Arrow keys also work. Press Z to decrease ball speed and X to increase it. Keep the ball from escaping through the gap.</div>
</div>

<div id="overlay">
  <h2>Game Over</h2>
  <div id="finalScore" style="font-size:16px;color:#aab2c5;"></div>
  <button id="restart">Play Again</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const centerX = W/2, centerY = H/2;
  const circleRadius = W/2 - 20;
  const ballRadius = 8;
  const paddleThickness = 12;

  const paddleSlider = document.getElementById('paddle');
  const speedVal = document.getElementById('speedVal');
  const paddleVal = document.getElementById('paddleVal');
  const MIN_SPEED = 1;
  const MAX_SPEED = 14;
  const SPEED_STEP = 0.1;
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const finalScoreEl = document.getElementById('finalScore');
  const restartBtn = document.getElementById('restart');

  let ballSpeed = 1.7;
  let paddleArcDeg = parseFloat(paddleSlider.value);
  let paddleAngle = -Math.PI / 2;
  let score = 0;
  let best = 0;
  let gameOver = false;
  let ball;

  const keys = { left: false, right: false };

  function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }

  function resetBall() {
    const angle = Math.random() * Math.PI * 2;
    ball = {
      x: centerX,
      y: centerY,
      vx: Math.cos(angle) * ballSpeed,
      vy: Math.sin(angle) * ballSpeed
    };
  }

  function resetGame() {
    score = 0;
    gameOver = false;
    scoreEl.textContent = score;
    overlay.classList.remove('show');
    resetBall();
  }

  function setBallSpeed(next) {
    ballSpeed = Math.min(MAX_SPEED, Math.max(MIN_SPEED, Math.round(next * 10) / 10));
    speedVal.textContent = ballSpeed.toFixed(1);
  }

  paddleSlider.addEventListener('input', () => {
    paddleArcDeg = parseFloat(paddleSlider.value);
    paddleVal.textContent = paddleArcDeg + '°';
  });

  function angleFromPointer(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const mx = clientX - rect.left - centerX;
    const my = clientY - rect.top - centerY;
    return Math.atan2(my, mx);
  }

  canvas.addEventListener('mousemove', e => {
    paddleAngle = angleFromPointer(e.clientX, e.clientY);
  });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    paddleAngle = angleFromPointer(t.clientX, t.clientY);
  }, { passive: false });

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;
    const key = e.key.toLowerCase();
    if (key === 'z') setBallSpeed(ballSpeed - SPEED_STEP);
    if (key === 'x') setBallSpeed(ballSpeed + SPEED_STEP);
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
  });

  restartBtn.addEventListener('click', resetGame);

  function update() {
    if (gameOver) return;

    if (keys.left) paddleAngle -= 0.045;
    if (keys.right) paddleAngle += 0.045;

    const speedNow = Math.hypot(ball.vx, ball.vy) || 1;
    const scale = ballSpeed / speedNow;
    ball.vx *= scale;
    ball.vy *= scale;

    ball.x += ball.vx;
    ball.y += ball.vy;

    const dx = ball.x - centerX;
    const dy = ball.y - centerY;
    const dist = Math.hypot(dx, dy);

    if (dist + ballRadius >= circleRadius) {
      const ballAngle = Math.atan2(dy, dx);
      const diff = normalizeAngle(ballAngle - paddleAngle);
      const halfArc = (paddleArcDeg * Math.PI / 180) / 2;

      if (Math.abs(diff) <= halfArc) {
        const nx = dx / dist, ny = dy / dist;
        const dot = ball.vx * nx + ball.vy * ny;
        ball.vx -= 2 * dot * nx;
        ball.vy -= 2 * dot * ny;

        const influence = diff / halfArc;
        const spd = Math.hypot(ball.vx, ball.vy);
        const curAngle = Math.atan2(ball.vy, ball.vx);
        const newAngle = curAngle + influence * 0.5;
        ball.vx = Math.cos(newAngle) * spd;
        ball.vy = Math.sin(newAngle) * spd;

        const overlap = dist + ballRadius - circleRadius;
        ball.x -= nx * overlap;
        ball.y -= ny * overlap;

        score++;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
        }
      } else {
        gameOver = true;
        finalScoreEl.textContent = 'You scored ' + score + ' bounces.';
        overlay.classList.add('show');
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.beginPath();
    ctx.arc(centerX, centerY, circleRadius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 2;
    ctx.stroke();

    const halfArc = (paddleArcDeg * Math.PI / 180) / 2;
    ctx.beginPath();
    ctx.arc(centerX, centerY, circleRadius, paddleAngle - halfArc, paddleAngle + halfArc);
    ctx.strokeStyle = '#5aa9ff';
    ctx.lineWidth = paddleThickness;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ballRadius, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd166';
    ctx.shadowColor = '#ffd166';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  resetBall();
  loop();
})();
</script>
</body>
</html>
