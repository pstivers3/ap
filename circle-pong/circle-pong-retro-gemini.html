<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular Pong - Retro Arcade</title>
    <style>
        :root {
            --bg-color: #000;
            --text-color: #0f0; /* Classic Terminal Green */
            --accent-color: #0f0;
            --danger-color: #f00;
            --panel-bg: #000;
        }

        @font-face {
            font-family: 'RetroFont';
            src: local('Courier New'), local('Courier'), monospace;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'RetroFont', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
            image-rendering: pixelated;
        }

        /* Scanline Overlay */
        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .panel {
            background: var(--panel-bg);
            padding: 2rem;
            border: 4px solid var(--accent-color);
            pointer-events: auto;
            text-align: center;
            min-width: 320px;
        }

        h1 { 
            margin: 0 0 1.5rem 0; 
            font-size: 2.5rem; 
            color: var(--accent-color);
            text-transform: uppercase;
        }

        p { margin-bottom: 2rem; }

        .controls {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 0.5rem;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            text-transform: uppercase;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: var(--accent-color);
            background: #222;
            height: 8px;
            appearance: none;
            border: 1px solid var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 1rem 2rem;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.2rem;
            text-transform: uppercase;
            font-family: 'RetroFont', monospace;
            transition: opacity 0.1s;
        }

        button:hover { opacity: 0.8; }
        button:active { transform: scale(0.98); }

        #hud {
            position: absolute;
            top: 2rem;
            left: 2rem;
            font-size: 2.5rem;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        #pause-hint {
            position: absolute;
            bottom: 2rem;
            font-size: 1.2rem;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud">SCORE: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-overlay">
        <!-- Start/Game Over Screen -->
        <div id="menu-panel" class="panel">
            <h1 id="menu-title">RETRO PONG</h1>
            <p id="menu-text">DEFEND THE CIRCLE.</p>
            <button id="start-btn">INSERT COIN</button>
            <div class="controls">
                <div class="slider-group">
                    <div class="slider-header">
                        <span>VELOCITY</span>
                        <span id="speed-val">1.0x</span>
                    </div>
                    <input type="range" id="speed-slider" min="0.5" max="3" step="0.1" value="1">
                </div>
                <div class="slider-group">
                    <div class="slider-header">
                        <span>PADDLE SIZE</span>
                        <span id="paddle-val">60°</span>
                    </div>
                    <input type="range" id="paddle-slider" min="20" max="120" step="5" value="60">
                </div>
                <div class="slider-group">
                    <div class="slider-header">
                        <span>ARENA SCALE</span>
                        <span id="circle-val">80%</span>
                    </div>
                    <input type="range" id="circle-slider" min="50" max="95" step="5" value="80">
                </div>
            </div>
        </div>

        <!-- Pause Screen -->
        <div id="pause-panel" class="panel hidden">
            <h1>PAUSED</h1>
            <p>SYSTEM HALTED.</p>
            <button id="resume-btn">RESUME</button>
            <div class="controls">
                <div class="slider-group">
                    <div class="slider-header">
                        <span>VELOCITY</span>
                        <span id="speed-val-p">1.0x</span>
                    </div>
                    <input type="range" id="speed-slider-p" min="0.5" max="3" step="0.1" value="1">
                </div>
                <div class="slider-group">
                    <div class="slider-header">
                        <span>PADDLE SIZE</span>
                        <span id="paddle-val-p">60°</span>
                    </div>
                    <input type="range" id="paddle-slider-p" min="20" max="120" step="5" value="60">
                </div>
                <div class="slider-group">
                    <div class="slider-header">
                        <span>ARENA SCALE</span>
                        <span id="circle-val-p">80%</span>
                    </div>
                    <input type="range" id="circle-slider-p" min="50" max="95" step="5" value="80">
                </div>
            </div>
        </div>
    </div>

    <div id="pause-hint">PRESS [SPACE] TO PAUSE</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    
    // UI Elements
    const menuPanel = document.getElementById('menu-panel');
    const pausePanel = document.getElementById('pause-panel');
    const menuTitle = document.getElementById('menu-title');
    const menuText = document.getElementById('menu-text');
    const startBtn = document.getElementById('start-btn');
    const resumeBtn = document.getElementById('resume-btn');

    // Game Constants & State
    const CONFIG = {
        baseBallSpeed: 4,
        ballRadius: 10,
        paddleThickness: 20,
        paddleOffset: 10,
        accentColor: '#0f0',
        dangerColor: '#f00',
        lineColor: '#0f0'
    };

    let state = {
        running: false,
        paused: false,
        score: 0,
        ball: { x: 0, y: 0, dx: 0, dy: 0 },
        paddle: { angle: 0, size: 60 * Math.PI / 180 },
        arena: { radius: 0 },
        settings: {
            speed: 1,
            paddle: 60,
            circle: 80
        },
        keys: {}
    };

    function init() {
        resize();
        window.addEventListener('resize', resize);
        
        window.addEventListener('keydown', (e) => {
            state.keys[e.code] = true;
            if (e.code === 'Space') togglePause();
        });
        window.addEventListener('keyup', (e) => state.keys[e.code] = false);
        window.addEventListener('mousemove', handleMouseMove);

        startBtn.onclick = startGame;
        resumeBtn.onclick = togglePause;

        setupSliders();
        resetGame();
        requestAnimationFrame(loop);
    }

    function setupSliders() {
        const updateSync = (key, val) => {
            const numVal = parseFloat(val);
            state.settings[key] = numVal;
            
            document.getElementById(`${key}-val`).innerText = formatVal(key, val);
            document.getElementById(`${key}-val-p`).innerText = formatVal(key, val);
            document.getElementById(`${key}-slider`).value = val;
            document.getElementById(`${key}-slider-p`).value = val;
            
            if (key === 'paddle') state.paddle.size = (numVal * Math.PI) / 180;
            if (key === 'circle') updateArenaRadius();
        };

        ['speed', 'paddle', 'circle'].forEach(key => {
            const s1 = document.getElementById(`${key}-slider`);
            const s2 = document.getElementById(`${key}-slider-p`);
            s1.oninput = (e) => updateSync(key, e.target.value);
            s2.oninput = (e) => updateSync(key, e.target.value);
        });
    }

    function formatVal(key, val) {
        if (key === 'speed') return val + 'x';
        if (key === 'paddle') return val + '°';
        if (key === 'circle') return val + '%';
        return val;
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        updateArenaRadius();
    }

    function updateArenaRadius() {
        const minDim = Math.min(canvas.width, canvas.height);
        state.arena.radius = (minDim / 2) * (state.settings.circle / 100);
    }

    function resetGame() {
        state.score = 0;
        scoreEl.innerText = '0';
        state.ball.x = canvas.width / 2;
        state.ball.y = canvas.height / 2;
        
        const angle = Math.random() * Math.PI * 2;
        const speed = CONFIG.baseBallSpeed * state.settings.speed;
        state.ball.dx = Math.cos(angle) * speed;
        state.ball.dy = Math.sin(angle) * speed;
    }

    function startGame() {
        resetGame();
        state.running = true;
        state.paused = false;
        menuPanel.classList.add('hidden');
        pausePanel.classList.add('hidden');
    }

    function togglePause() {
        if (!state.running) return;
        state.paused = !state.paused;
        pausePanel.classList.toggle('hidden', !state.paused);
    }

    function gameOver() {
        state.running = false;
        menuTitle.innerText = "GAME OVER";
        menuTitle.style.color = CONFIG.dangerColor;
        menuText.innerText = `SCORE: ${state.score}`;
        startBtn.innerText = "PLAY AGAIN";
        menuPanel.classList.remove('hidden');
    }

    function handleMouseMove(e) {
        if (state.paused) return;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        state.paddle.angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
    }

    function update() {
        if (!state.running || state.paused) return;

        const paddleSpeed = 0.08;
        if (state.keys['ArrowLeft'] || state.keys['KeyA']) state.paddle.angle -= paddleSpeed;
        if (state.keys['ArrowRight'] || state.keys['KeyD']) state.paddle.angle += paddleSpeed;

        state.ball.x += state.ball.dx * state.settings.speed;
        state.ball.y += state.ball.dy * state.settings.speed;

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const dist = Math.hypot(state.ball.x - centerX, state.ball.y - centerY);
        const collisionRadius = state.arena.radius - CONFIG.ballRadius - CONFIG.paddleOffset - CONFIG.paddleThickness/2;

        if (dist >= collisionRadius) {
            const ballAngle = Math.atan2(state.ball.y - centerY, state.ball.x - centerX);
            let diff = ballAngle - state.paddle.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;

            if (Math.abs(diff) <= state.paddle.size / 2) {
                state.score++;
                scoreEl.innerText = state.score;

                const normalX = (state.ball.x - centerX) / dist;
                const normalY = (state.ball.y - centerY) / dist;
                const dot = state.ball.dx * normalX + state.ball.dy * normalY;
                
                if (dot > 0) {
                    state.ball.dx -= 2 * dot * normalX;
                    state.ball.dy -= 2 * dot * normalY;
                    state.ball.dx *= 1.02;
                    state.ball.dy *= 1.02;
                    state.ball.x = centerX + normalX * (collisionRadius - 1);
                    state.ball.y = centerY + normalY * (collisionRadius - 1);
                }
            } else if (dist >= state.arena.radius) {
                gameOver();
            }
        }
    }

    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        // Draw Arena Boundary (Dashed/Pixelated look)
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.arc(centerX, centerY, state.arena.radius, 0, Math.PI * 2);
        ctx.strokeStyle = state.running ? CONFIG.accentColor : CONFIG.dangerColor;
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.setLineDash([]);

        // Draw Paddle (Solid Block)
        const startAngle = state.paddle.angle - state.paddle.size / 2;
        const endAngle = state.paddle.angle + state.paddle.size / 2;
        const paddleRadius = state.arena.radius - CONFIG.paddleOffset - CONFIG.paddleThickness/2;

        ctx.beginPath();
        ctx.arc(centerX, centerY, paddleRadius, startAngle, endAngle);
        ctx.strokeStyle = CONFIG.accentColor;
        ctx.lineWidth = CONFIG.paddleThickness;
        ctx.stroke();

        // Draw Ball (Square look)
        ctx.fillStyle = state.running ? (state.paused ? '#555' : CONFIG.accentColor) : CONFIG.dangerColor;
        ctx.fillRect(state.ball.x - CONFIG.ballRadius, state.ball.y - CONFIG.ballRadius, CONFIG.ballRadius * 2, CONFIG.ballRadius * 2);
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    init();
</script>

</body>
</html>
